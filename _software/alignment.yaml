software:
  - id: bowtie
    name: Bowtie
    status: current
    category:
      - alignment
      - short-read
    pmcid: PMC2690996
    url: https://bowtie-bio.sourceforge.net/index.shtml
    description: >
      An ultrafast, memory-efficient short read aligner that aligns short DNA
      sequences to the human genome at a rate of about 25 million reads per hour
      on a typical desktop computer. Bowtie indexes the genome with a
      Burrows-Wheeler index to keep its memory footprint small: 2.3 GB for the
      human genome. Bowtie and Bowtie2 were developed by Ben Langmead and are
      actively supported by his lab.

  - id: hisat
    name: HISAT
    status: current
    category:
      - alignment
      - rna-seq
    pmcid: PMC4655817
    url: https://github.com/DaehwanKimLab/hisat/wiki
    description: >
      HISAT is a highly efficient system for aligning RNA-seq reads. HISAT uses
      a novel indexing scheme, hierarchical indexing, which is inherently
      well-suited for aligning across introns. It employs two types of indexes
      for alignment: (1) a whole-genome FM index to anchor each alignment, and
      (2) numerous local FM indexes for very rapid extensions of these
      alignments. HISAT supports genomes of any size, including those larger
      than 4 billion bases.

  - id: hisat2
    name: HISAT2
    status: current
    category:
      - alignment
      - dna-seq
      - rna-seq
    pmcid: PMC7605509
    url: https://daehwankimlab.github.io/hisat2/
    description: >
      HISAT2 is a new, rapid and accurate system for aligning NGS reads (both
      DNA and RNA) against a population of genomes. HISAT2 is a successor to
      both HISAT and TopHat2. HISAT2 extends the Burrows-Wheeler transform (BWT)
      and the Ferragina-Manzini (FM) index to incorporate genomic differences
      among individuals into the reference genome. HISAT2 is currently
      maintained at https://kim-lab.org/.

  - id: hisat-genotype
    name: HISAT-genotype
    status: current
    category:
      - alignment
      - genotyping
      - hla
      - dna-seq
    pmcid: PMC7605509
    url: https://daehwankimlab.github.io/hisat-genotype/
    description: >
      HISAT-genotype is a next-generation platform that enables rapid and
      accurate genomic analysis of our genomes using next-generation sequencing
      data on a desktop within a few hours. The platform currently supports HLA
      typing, discovery of novel HLA alleles, DNA fingerprinting analysis, and
      other functionalities. All HISAT programs were developed by Daehwan Kim
      and are currently maintained at https://kim-lab.org/.

  - id: arioc
    name: Arioc
    status: older
    category:
      - alignment
      - short-read
      - gpu
      - wgs
      - wbgs
    pmcid: PMC4358639
    url: https://github.com/rwilton/arioc
    description: >
      Arioc is a GPU-accelerated DNA short-read aligner for WGS and WGBS reads.
      With high throughput (~1.5 to 2 million reads per second with the human
      reference genome in a 4-GPU computer), it is well suited to large-scale
      NGS data processing.

  - id: tophat
    name: TopHat
    status: older
    category:
      - alignment
      - rna-seq
      - splicing
    pmcid: PMC2672628
    url: https://github.com/DaehwanKimLab/tophat/wiki
    description: >
      A spliced alignment system for RNA-seq experiments. TopHat finds known and
      novel exon-exon splice junctions and is extremely fast due to its use of
      the Bowtie2 aligner. The last release, TopHat2, runs with either Bowtie1
      or Bowtie2 and includes algorithms that significantly enhance TopHat's
      sensitivity, particularly in the presence of pseudogenes. TopHat2
      includes TopHat-Fusion as an option.

  - id: tophat-fusion
    name: TopHat-Fusion
    status: older
    category:
      - alignment
      - rna-seq
      - fusion
    pmcid: PMC3245612
    url: https://github.com/DaehwanKimLab/tophat/wiki/Fusion-Home
    description: >
      TopHat-Fusion is an enhanced version of TopHat with the ability to align
      reads across fusion points, which results from the breakage and re-joining
      of two different chromosomes, or from rearrangements within a chromosome.

  - id: cloudburst
    name: CloudBurst
    status: older
    category:
      - alignment
      - short-read
      - mapreduce
      - hadoop
    pmcid: PMC2682523
    url: https://cloudburst-bio.sf.net
    description: >
      An older program for highly sensitive short read mapping using MapReduce.
      CloudBurst, developed by Michael Schatz (now a faculty member at JHU
      Computer Science), uses Hadoop to efficiently parallelize the short read
      mapping problem to dozens or hundreds of computers. This enables CloudBurst
      to execute highly sensitive read mappings with any number of mutations or
      indels.

  - id: crossbow
    name: Crossbow
    status: older
    category:
      - alignment
      - resequencing
      - hadoop
      - variant-calling
    pmcid: PMC3091327
    url: https://bowtie-bio.sourceforge.net/crossbow/index.shtml
    description: >
      Crossbow is an early scalable software pipeline for whole genome
      resequencing analysis. It combines Bowtie, an ultrafast and memory
      efficient short read aligner, and SoapSNP, an accurate genotyper, within
      Hadoop to distribute and accelerate the computation with many nodes. In
      the CrossBow paper, we used it to analyze 35x coverage of a human genome
      in 3 hours for about $100 using a 40-node, 320-core cluster rented from
      Amazon's EC2 utility computing service.
