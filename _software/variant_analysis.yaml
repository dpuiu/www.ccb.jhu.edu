software:
  - id: chasm-snvbox
    name: CHASM and SNVBox
    status: current
    category:
      - variant-analysis
      - cancer
      - missense
    pmcid: PMC3137226
    description: >
      Software to predict the functional significance of somatic missense
      mutations observed in the genomes of cancer cells, and a database of
      pre-computed features of all possible amino acid substitutions at every
      position of the annotated human exome.
    url: https://github.com/KarchinLab/CHASMplus

  - id: cravat
    name: CRAVAT
    status: current
    category:
      - variant-analysis
      - cancer
      - annotation
    url: https://www.cravat.us/
    pmcid: PMC3582272
    description: >
      Cancer-related analysis of variants toolkit. Web tool for functional
      predictions and annotations of both somatic and germline variants.

  - id: fast
    name: FAST
    status: current
    category:
      - variant-analysis
      - gene-based-analysis
    url: https://bitbucket.org/baderlab/fast/wiki/Home
    pmcid: PMC3720833
    description: >
      An application for genome-wide studies by efficiently running several
      gene-based analysis methods simultaneously on the same data set.

  - id: ls-snp-pdb
    name: LS-SNP/PDB
    status: current
    category:
      - variant-analysis
      - structural-analysis
      - missense
    url: https://ls-snp.icm.jhu.edu/
    pmcid: PMC6276889
    description: >
      Web tool for structural annotations and visualizations of missense
      variants in dbSNP.

  - id: mupit
    name: muPIT
    status: current
    category:
      - variant-analysis
      - structural-analysis
      - missense
    url: https://mupit.icm.jhu.edu/
    pmcid: PMC3797853
    description: >
      Web tool for interactive structural annotations and visualizations of
      non-synonymous variation and mutations on proteins.
