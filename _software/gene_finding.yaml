software:
  - id: eviann
    name: EviAnn
    status: newer
    category:
      - gene-prediction
      - genome-annotation
      - rna-seq
      - transcript-annotation
    url: https://github.com/alekseyzimin/EviAnn_release
    pmcid: PMC12132231
    description: >
      A novel genome annotation software package based entirely on experimental
      evidence. It derives protein-coding gene and long non-coding RNA (lncRNA)
      annotations from RNA-seq data and/or transcript sequences, together with
      alignments of proteins from related species.

  - id: lifton
    name: LiftOn
    status: newer
    category:
      - genome-annotation
      - gene-annotation
      - genome-assembly
    url: https://github.com/Kuanhao-Chao/LiftOn
    pmcid: PMC11874971
    description: >
      LiftOn combines DNA and protein alignments to improve genome annotation.

  - id: liftoff
    name: Liftoff
    status: newer
    category:
      - genome-annotation
      - gene-annotation
      - genome-assembly
    url: https://github.com/agshumate/Liftoff
    pmcid: PMC8289374
    description: >
      Liftoff provides accurate mapping of gene annotations between genome
      assemblies. 

  - id: balrog
    name: Balrog
    status: newer
    category:
      - gene-prediction
      - protein
      - prokaryote
    url: https://github.com/salzberg-lab/Balrog
    pmcid: PMC7946324
    description: >
      Balrog is a universal protein model for prokaryotic gene prediction.

  - id: orfanage
    name: ORFanage
    status: newer
    category:
      - gene-prediction
      - transcript-analysis
      - orf
    url: https://github.com/alevar/ORFanage
    pmcid: PMC10718564
    description: >
      ORFanage investigates open reading frames in known and novel transcripts.

  - id: glimmer
    name: Glimmer
    status: older
    category:
      - gene-prediction
      - prokaryote
      - microbial-genomics
    url: https://github.com/salzberg-lab/glimmer/wiki
    pmcid: PMC148753
    description: >
      A system that uses interpolated Markov models to find genes in microbial
      DNA. Used to annotate hundreds (possibly thousands) of bacterial,
      archaeal, and viral genomes. Current version is 3.02.

  - id: glimmerhmm
    name: GlimmerHMM
    status: older
    category:
      - gene-prediction
      - eukaryote
      - hidden-markov-model
    url: https://github.com/salzberg-lab/glimmerhmm/wiki
    pmcid: PMC1810558
    description: >
      A Generalized Hidden Markov Model gene-finder which makes use of the
      techniques implemented previously by GlimmerM.

  - id: glimmer-mg
    name: Glimmer-MG
    status: older
    category:
      - gene-prediction
      - metagenomics
      - prokaryote
    url: https://github.com/davek44/Glimmer-MG
    pmcid: PMC3245904
    description: >
      Glimmer-MG is an older system for finding genes in metagenomic shotgun DNA
      sequences, using the Glimmer algorithm plus the SCIMM system for clustering
      metagenomics data, and the now-outdated Phymm system for phylogenetic
      labeling.

  - id: genesplicer
    name: GeneSplicer
    status: older
    category:
      - gene-prediction
      - splice-sites
      - eukaryote
    url: https://github.com/salzberg-lab/genesplicer/wiki
    pmcid: PMC29713
    description: >
      A fast system for detecting splice sites in genomic DNA of various
      eukaryotes.

  - id: jigsaw
    name: JIGSAW
    status: older
    category:
      - gene-prediction
      - genome-annotation
      - evidence-integration
    url: https://github.com/salzberg-lab/jigsaw/wiki
    pmcid: PMC1810558
    description: >
      A program that predicts gene models using the output from multiple sources
      of evidence, including other gene finders, BLAST searches, and other
      alignment data.
