software:
  - id: mummer4
    name: MUMmer
    status: current
    category:
      - genome-assembly
      - whole-genome-alignment
      - genome-comparison
    url: https://github.com/mummer4/mummer
    pmcid: PMC5802927
    description: >
      A system for aligning whole genomes, chromosomes, and other very long DNA
      sequences. MUMmer is also widely used for comparing genome assemblies.
      MUMmer was hosted on SourceForge beginning in the early 2000s and moved
      to GitHub with the release of MUMmer4 in 2017.

  - id: mummergpu
    name: MUMmerGPU
    status: older
    category:
      - genome-assembly
      - alignment
      - gpu
    url: https://mummergpu.sourceforge.net/
    pmcid: PMC2222658
    description: >
      An early attempt to use GPUs for alignment. MUMmerGPU uses a technique
      called general-purpose GPU programming (GPGPU programming) to harness the
      extreme parallelism of GPUs for non-graphics tasks.

  - id: gage
    name: GAGE
    status: older
    category:
      - genome-assembly
      - assembly-evaluation
      - benchmarking
    url: https://gage.cbcb.umd.edu/
    pmcid: PMC3290791
    description: >
      A realistic assessment of genome assembly software in a rapidly changing
      field of next-generation sequencing.

  - id: gage-b
    name: GAGE-B
    status: older
    category:
      - genome-assembly
      - assembly-evaluation
      - benchmarking
      - bacteria
    url: https://github.com/salzberg-lab/GAGE_B
    pmcid: PMC3702249
    description: >
      An evaluation of contiguity and accuracy of assemblies of bacterial
      organisms generated by some of the most commonly used genome assemblers.
      GAGE-B follows the standards set by GAGE.

  - id: masurca
    name: MaSuRCA
    status: current
    category:
      - genome-assembly
      - whole-genome-assembly
      - hybrid-assembly
      - short-read
      - long-read
    url: https://github.com/alekseyzimin/masurca
    pmcid: PMC3799473
    description: >
      MaSuRCA is a whole-genome assembler developed originally at the University
      of Maryland. Ongoing development is a joint effort between JHU and UMD, with recent modules
      designed to create hybrid assemblies using both short reads (Illumina) and
      long reads (PacBio/Oxford Nanopore).

  - id: polca
    name: POLCA
    status: current
    category:
      - genome-assembly
      - assembly-polishing
      - hybrid-assembly
      - short-read
      - long-read
    url: https://github.com/alekseyzimin/Polca
    pmcid: PMC7347232
    description: >
      POLCA is a polishing tool for genome assemblies that uses short sequencing
      reads to correct errors and improve the accuracy of assemblies generated
      from long-read or hybrid sequencing data. It is part of the MaSuRCA genome
      assembly toolkit.

  - id: samba
    name: SAMBA
    status: current
    category:
      - genome-assembly
      - scaffolding
      - genome-scaffolding
      - long-range-scaffolding
    url: https://github.com/alekseyzimin/SAMBA
    pmcid: PMC8849508
    description: >
      SAMBA is a genome scaffolding tool that uses long-range linkage information
      to order and orient assembled contigs into chromosome-scale scaffolds. It
      was developed by Aleksey Zimin and colleagues and is designed to improve
      genome assemblies by incorporating long-range sequencing information.

  - id: flash
    name: FLASH
    status: older
    category:
      - read-merging
      - short-read
      - illumina
    url: https://github.com/salzberg-lab/flash/wiki
    pmcid: PMC3198573
    description: >
      A fast, accurate program to increase the length of reads by overlapping
      and merging paired reads from fragments shorter than twice the length of
      reads. Primarily designed to merge Illumina paired reads.

  - id: jasper
    name: JASPER
    status: newer
    category:
      - genome-assembly
      - assembly-polishing
    url: https://github.com/alguoo314/JASPER
    pmcid: PMC10096238
    description: >
      JASPER is a fast genome polishing tool that improves the accuracy of
      genome assemblies.

  - id: amos
    name: AMOS Assembler project
    status: older
    category:
      - genome-assembly
      - assembler
    url: https://amos.sourceforge.net/
    pmcid: PMC3072823
    description: >
      A set of tools, libraries, and freestanding genome assemblers, all open
      source. AMOS is an open consortium started at The Institute for Genomic
      Research (TIGR) that grew to include the University of Maryland, Johns
      Hopkins University, the Karolinska Institutet, the Marine Biological
      Laboratory, and others.

  - id: amoscmp
    name: AMOScmp
    status: older
    category:
      - genome-assembly
      - comparative-assembly
    url: https://amos.sourceforge.net/docs/pipeline/AMOScmp.html
    pmcid: PMC3603210
    description: >
      A comparative genome assembler that uses one genome as a reference on
      which to assemble another, closely related species. 

  - id: minimus
    name: MINIMUS
    status: older
    category:
      - genome-assembly
      - small-genome-assembly
      - assembler
    url: https://amos.sourceforge.net/docs/pipeline/minimus.html
    pmcid: PMC1821043
    description: >
      A small, lightweight assembler for small jobs such as assembling a viral
      genome, assembling a set of reads that match a single gene, or other
      tasks that do not require the complex infrastructure of a large-genome
      assembler.

  - id: hawkeye
    name: Hawkeye
    status: older
    category:
      - genome-assembly
      - assembly-analysis
      - assembly-validation
      - visualization
    url: https://amos.sourceforge.net/hawkeye/
    pmcid: PMC1868940
    description: >
      A visual analytics tool for genome assembly analysis and validation,
      designed to aid in identifying and correcting assembly errors. All levels
      of the assembly data hierarchy are made accessible to users, along with
      summary statistics and common assembly metrics. A ranking component guides
      investigation towards likely mis-assemblies or interesting features.
      Hawkeye can be used to interactively analyze assemblies from many popular
      assemblers on a desktop computer. 

  - id: quake
    name: Quake
    status: older
    category:
      - sequencing-error-correction
      - short-read
      - wgs
    url: https://github.com/davek44/Quake/wiki
    pmcid: PMC3156955
    description: >
      A software package to detect and correct substitution sequencing errors
      in WGS data sets with deep coverage.

  - id: celera-assembler
    name: Celera Assembler
    status: older
    category:
      - genome-assembly
      - whole-genome-assembly
      - long-read
    url: https://wgs-assembler.sourceforge.net
    pmcid: PMC2639302
    description: >
      A whole-genome assembler originally developed at Celera Genomics for the
      assembly of the human genome. Celera Assembler is an open-source project
      at SourceForge. The code has been actively maintained since 2005 by
      researchers at CBCB and the Venter Institute, formerly known as TIGR, the
      Institute for Genomic Research.

  - id: abba
    name: ABBA
    status: older
    category:
      - genome-assembly
      - comparative-assembly
      - gene-assembly
    url: https://amos.sourceforge.net/docs/pipeline/abba.html
    pmcid: PMC2529408
    description: >
      Assembly Boosted By Amino acid sequence is a comparative gene assembler
      that uses amino acid sequences from predicted proteins to help build a
      better assembly.

  - id: autoeditor
    name: AutoEditor
    status: older
    category:
      - sequencing-error-correction
      - sanger
      - assembly
    url: https://sourceforge.net/apps/mediawiki/amos/index.php?title=AutoEditor
    pmcid: PMC373340
    description: >
      A tool for correcting sequencing and basecaller errors using sequence
      assembly and chromatogram data from Sanger (first-generation) reads. On
      average, AutoEditor corrects 80% of erroneous base calls, with an accuracy
      of 99.99%.
