software:
  - id: stringtie
    name: StringTie
    status: current
    category:
      - transcriptome-assembly
    url: https://github.com/gpertea/stringtie/wiki
    pmcid: PMC4707948
    description: 'A fast and accurate transcript assembler and abundance estimator
      for RNA-seq data. Designed as a successor to Cufflinks, StringTie assembles
      transcripts from the alignments produced by TopHat2, HISAT, or other spliced
      aligners, and quantifies those transcripts.'

  - id: tiebrush
    name: TieBrush
    status: current
    category:
      - transcriptome-assembly
    url: https://github.com/alevar/tiebrush
    pmcid: PMC8545345
    description: 'A utility for efficiently merging redundant information from multiple
      alignment files, designed to enable rapid manipulation of extremely large datasets
      (RNA-seq, whole-genome, exome, etc.). Data representations built with TieBrush
      and TieCov can be used for easier programmatic and visual analysis and comparison
      of groups within large sequencing datasets.'

  - id: eastr
    name: EASTR
    status: current
    category:
      - transcriptome-assembly
    url: https://github.com/salzberg-lab/EASTR/wiki
    pmcid: PMC10632439
    description: 'EASTR is a tool for detecting spuriously spliced alignments and
      junctions in RNA-seq datasets and reference annotations. It improves the accuracy
      of downstream analyses, such as transcriptome assembly, by identifying and removing
      misaligned spliced alignments. The tool can process GTF, BED, and BAM files
      as input.'

  - id: gffread
    name: GffRead
    status: current
    category:
      - transcriptome-assembly
    url: https://github.com/gpertea/gffread/wiki
    pmcid: PMC7222033
    description: 'A program for filtering, converting, and manipulating GFF files.'

  - id: gffcompare
    name: GffCompare
    status: current
    category:
      - transcriptome-assembly
    url: https://github.com/gpertea/gffcompare/wiki
    pmcid: PMC7222032
    description: 'A program for comparing, annotating, merging, and tracking transcripts
      in GFF files.'

  - id: transigner
    name: TranSigner
    status: newer
    category:
      - transcriptome-assembly
    url: https://github.com/haydenji0731/transigner
    pmcid: PMC11343119
    description: 'TranSigner improves transcriptome expression quantification through
      accurate assignment of long RNA sequencing reads.'

  - id: spit
    name: SPIT
    status: newer
    category:
      - transcriptome-assembly
    url: https://github.com/berilerdogdu/SPIT
    pmcid: PMC10985272
    description: 'SPIT detects differential transcript usage in complex diseases.'

  - id: phylocsf-plus-plus
    name: PhyloCSF++
    status: newer
    category:
      - transcriptome-assembly
    url: https://github.com/cpockrandt/PhyloCSFpp
    pmcid: PMC9991890
    description: 'PhyloCSF++ is a fast and user-friendly implementation of PhyloCSF
      with annotation tools.'

  - id: cufflinks
    name: Cufflinks
    status: older
    category:
      - transcriptome-assembly
    url: https://cole-trapnell-lab.github.io/cufflinks/
    pmcid: PMC3334321
    description: 'A transcript assembler and abundance estimator for RNA-seq data.
      Cufflinks assembles transcripts from the alignments produced by TopHat, including
      novel isoforms, and quantifies those transcripts. Cufflinks was originally developed
      by Cole Trapnell and is supported by his lab at the University of Washington.'

  - id: ballgown
    name: Ballgown
    status: older
    category:
      - transcriptome-assembly
    url: https://github.com/alyssafrazee/ballgown
    pmcid: PMC4792117
    description: 'A program for computing differentially expressed genes in two or
      more RNA-seq experiments, using the output of StringTie or Cufflinks. The Ballgown
      package provides functions to organize, visualize, and analyze expression measurements.
      Ballgown is written in R and is part of Bioconductor.'

  - id: edge-pro
    name: EDGE-pro
    status: older
    category:
      - transcriptome-assembly
    url: https://github.com/salzberg-lab/edge-pro/wiki
    pmcid: PMC3603529
    description: 'EDGE-pro is a program for estimating gene expression from prokaryotic
      RNA-seq. EDGE-pro uses Bowtie2 for alignment but, unlike TopHat and Cufflinks,
      does not allow spliced alignments. It also handles overlapping genes, a common
      phenomenon in bacteria that is largely absent in eukaryotes.'
