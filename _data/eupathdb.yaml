data:
  - id: eupathdb54
    name: EuPathDB54
    status: current
    category:
      - eukaryotic-pathogens
      - genome-database
      - metagenomics
      - kraken2-database
    url: https://github.com/dpuiu/eupathDB/
    description: >
      Latest curated database of eukaryotic pathogen genomes.
      Contains ~504 genomes from major eukaryotic pathogen
      groups and has been processed to remove contaminating and
      low-complexity sequences. A pre-built Kraken 2 database and the
      individual genome collections are provided.
    pmcid: PMC6034898

